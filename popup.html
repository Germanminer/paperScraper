<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h3>Exam Importer</h3>
  <button id="add">
    <span>Find & Add Assessments</span>
  </button>
  <p class="disclaimer">
    Please review the imported assessments and confirm that all important details have been added to your calendar.
  </p>

  <div id="selection-wrapper" class="hidden">
    <hr>
    <p style="font-size: 12px; margin-bottom: 8px;">Select a table to import:</p>
    <div id="results-container"></div>
  </div>
</div>

<div class="card">
  <h4>Settings</h4>
  <div style="margin-bottom: 16px;">
    <label for="namingConvention">TITLE FORMAT</label>
    <select id="namingConvention">
      <option value="full">Class Name + Assessment</option>
      <option value="index">Class Name + Index (A1, A2)</option>
    </select>
  </div>

  <label class="checkbox-group">
    <input type="checkbox" id="showPercentage">
    <span>Include grade percentage in details</span>
  </label>

  <label style="font-size: 11px; letter-spacing: 0.05em;">REMINDERS</label>
  <div id="reminder-options" class="reminder-grid">
    <label class="reminder-label"><input type="checkbox" class="reminder-check" value="20160"> 2 Weeks</label>
    <label class="reminder-label"><input type="checkbox" class="reminder-check" value="10080"> 1 Week</label>
    <label class="reminder-label"><input type="checkbox" class="reminder-check" value="2880"> 2 Days</label>
    <label class="reminder-label"><input type="checkbox" class="reminder-check" value="1440"> 1 Day</label>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
