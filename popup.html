<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      font-family: Arial;
      padding: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<h3>Exam Importer</h3>
<button id="scan">Get assessments</button>
<button id="name">Get Name</button>
<button id="add">Add to Calendar</button>

<hr>
<div id="settings-area">
  <h4>Settings</h4>
  <div style="margin-bottom: 10px;">
    <label for="namingConvention" style="font-size: 12px;">Event Title Format:</label>
    <select id="namingConvention" style="width: 100%;">
      <option value="full">Class Name + Assessment</option>
      <option value="index">Class Name + Index (e.g., A1, A2)</option>
    </select>
  </div>

  <div style="margin-bottom: 10px;">
    <label style="font-size: 12px;">
      <input type="checkbox" id="showPercentage"> Include % in details
    </label>
  </div>
  <div class="option" style="margin-top: 15px;">
    <label style="font-size: 12px; font-weight: bold;">Reminders:</label>
    <div id="reminder-options" style="font-size: 11px; display: flex; flex-direction: column; gap: 4px; margin-top: 5px;">
      <label><input type="checkbox" class="reminder-check" value="20160"> 2 Weeks before</label>
      <label><input type="checkbox" class="reminder-check" value="10080"> 1 Week before</label>
      <label><input type="checkbox" class="reminder-check" value="2880"> 2 Days before</label>
      <label><input type="checkbox" class="reminder-check" value="1440"> Day before</label>
      <label><input type="checkbox" class="reminder-check" value="0"> Day of</label>
    </div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
