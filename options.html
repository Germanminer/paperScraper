<!DOCTYPE html>
<html>
<head>
    <title>Extension Settings</title>
    <style>
        body { padding: 20px; font-family: sans-serif; line-height: 1.6; }
        .option { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
    </style>
</head>
<body>
<h2>Calendar Settings</h2>

<div class="option">
    <label for="namingConvention">Event Title Format:</label>
    <select id="namingConvention">
        <option value="full">Class Name + Assessment Name</option>
        <option value="index">Class Name + Index (e.g., A1, A2, ...)</option>
    </select>
</div>

<div class="option">
    <label>
        <input type="checkbox" id="showPercentage"> Include percentage in description
    </label>
</div>

<button id="save">Save Settings</button>
<p id="status"></p>

<script src="options.js"></script>
</body>
</html>
